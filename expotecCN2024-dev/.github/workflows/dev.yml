name: Deploy Django DEV

# Roda em Push e PR pra dev
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
    types:
      - closed

jobs:
  deploy_dev:
    runs-on: ubuntu-latest
    steps:
    - name: Setup SSH # Cria as chaves locais a partir de segredos salvos no Github
      run: |
        mkdir -p ~/.ssh/
        echo "${{ secrets.SSH_KEY_PRIV }}" > ~/.ssh/id_ed25519
        echo "${{ secrets.SSH_KEY_PUB }}" > ~/.ssh/id_ed25519.pub
        chmod 600 ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519.pub
        ssh-keyscan -H ${{ secrets.IP }} >> ~/.ssh/known_hosts
    - name: Run DEV Deployment
      run: |
        ssh -i ~/.ssh/id_ed25519 ${{ secrets.SERVER }} "bash deploy_dev.sh expotecspp_dev"
      env:
        ACTIONS_RUNNER_DEBUG: false
